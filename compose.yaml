services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ceres
      POSTGRES_PASSWORD: ceres
      POSTGRES_DB: ceres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ceres -d ceres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
